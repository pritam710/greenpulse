# GreenPulse API deployment. DATABASE_URL is supplied manually so the API can
# use the persistent Neon database instead of the expiring Render database.
services:
  - type: web
    name: greenpulse-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-hosting.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://pritam710.github.io
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
databases:
  - name: greenpulse-pilot-db
    plan: free
    region: singapore
    databaseName: greenpulse
    user: greenpulse
    ipAllowList: []
