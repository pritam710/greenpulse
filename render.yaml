# Free presentation pilot: database expires after 30 days. See HOSTING.md.
services:
  - type: web
    name: greenpulse-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements-hosting.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://pritam710.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: greenpulse-pilot-db
          property: connectionString
databases:
  - name: greenpulse-pilot-db
    plan: free
    region: singapore
    databaseName: greenpulse
    user: greenpulse
    ipAllowList: []
